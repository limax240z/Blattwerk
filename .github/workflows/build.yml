# Baut Blattwerk für macOS (Apple Silicon und Intel) und Windows und führt alle Tests aus.
# Signieren mit Zertifikat ist optional: Sind die Secrets nicht gesetzt, wird die Mac-App nur ad hoc signiert.
# Mac-Rechner abschalten: Variable MAC_IN_CI = false (Projekteinstellungen → Variables). Dann laufen nur die
# Windows-Teile, die Mac-Dateien baut und lädt scripts/publish-mac-local.mjs vom eigenen Mac hoch. Grund: Das neue
# Konto bekam im Oktober 2026 keine Mac-Rechner von GitHub (Aufträge brachen nach 15 Minuten Warten ab).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein neuer Stand bricht ältere Läufe desselben Zweigs ab
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen und testen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.MAC_IN_CI == 'false' && '["windows-latest"]' || '["macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: qpdf für die Ausgabeprüfung installieren
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install qpdf; else choco install qpdf --no-progress -y; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run licenses
      - name: Große Testdatei erzeugen
        run: npm run fixtures -- --large
      - run: npm test
      - name: Bildschirmauflösung für die Oberflächentests (Windows)
        # Der Windows-Rechner startet mit 1024 × 768; das Fenster (1280 × 860) passt dann nicht und die Werkzeugleiste
        # klappt Knöpfe ins Menü „Weitere Werkzeuge“
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Auflösung nicht geändert: $_" }
          Get-CimInstance -ClassName Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - name: Oberflächentests
        # Hängende Tests sollen nicht stundenlang laufen (normal: etwa 6 Minuten)
        timeout-minutes: 30
        run: npm run test:e2e -- --max-failures=15
        env:
          # Unter Windows zeichnen verborgene Fenster kaum (jede Mausbewegung wartet), Tests laufen dann in die
          # Zeitgrenze. Auf dem CI-Rechner sieht niemand zu; unter macOS bleiben die Fenster verborgen.
          BLATTWERK_E2E_SHOW: ${{ runner.os == 'Windows' && '1' || '' }}

  package:
    name: Paket (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.MAC_IN_CI == 'false' && '[{"name":"Windows", "os":"windows-latest", "command":"npm run dist:win"}]' || '[{"name":"macOS", "os":"macos-latest", "command":"npm run dist:mac"}, {"name":"Windows", "os":"windows-latest", "command":"npm run dist:win"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: App bauen
        # bash auch unter Windows: Leere Secrets müssen ganz fehlen, sonst hält electron-builder „CSC_LINK=“ für einen
        # Pfad (den Arbeitsordner) und bricht ab („not a file“)
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          ${{ matrix.command }}
        env:
          # Optional: Apple-Developer-Zertifikat (macOS) bzw. Code-Signing-Zertifikat (Windows) als Base64
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Sonst signiert electron-builder in Pull-Requests gar nicht. Die Fuses ändern die App aber trotzdem, ihre
          # Signatur ist dann ungültig und macOS beendet sie beim Start (Code Signature Invalid). Das Zertifikat aus
          # den Secrets bekommen Pull-Requests aus Forks ohnehin nicht; ohne Zertifikat wird ad hoc signiert.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Signatur prüfen
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/Blattwerk.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          # So entpackt auch der Updater in der App (ADR 0027): Die Signatur muss das Archiv überstehen
          for zip in release/*-mac.zip; do
            dir="$(mktemp -d)"
            ditto -x -k "$zip" "$dir"
            codesign --verify --deep --strict "$dir/Blattwerk.app"
            rm -rf "$dir"
          done
      - name: Update einspielen (Windows)
        # Installiert das fertige Programm in einen Testordner und spielt es als Update ein: Installation, Aufräumen
        # und Neustart der App müssen klappen (Fehlerbericht: „Jetzt aktualisieren“ schloss die App, sonst nichts)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/smoke-update-win.mjs "$(ls release/Blattwerk-Setup-*.exe | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: Blattwerk-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.exe
          if-no-files-found: error

  # Jede neue Version auf main kommt als Release in das öffentliche Projekt für Downloads (ADR 0027). Dort findet die App
  # sie über „Nach Updates suchen“. Braucht das Secret DOWNLOADS_TOKEN (Schlüssel mit Schreibrecht nur für dieses Projekt).
  release:
    name: Veröffentlichen
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          REPOSITORY: limax240z/Blattwerk-Downloads
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret DOWNLOADS_TOKEN fehlt, es wird nichts veröffentlicht."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          ls -l dist
          # Gibt es das Release schon (etwa mit den vom Mac hochgeladenen Mac-Dateien), nur fehlende Dateien ergänzen
          if existing="$(gh release view "v$version" --repo "$REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            for file in dist/*; do
              if grep -qxF "$(basename "$file")" <<< "$existing"; then continue; fi
              gh release upload "v$version" "$file" --repo "$REPOSITORY"
            done
            exit 0
          fi
          gh release create "v$version" dist/* --repo "$REPOSITORY" --title "Blattwerk $version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Updates lädt Blattwerk über „Nach Updates suchen …“ selbst."
